name: Intelligent release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Reanalyze an already processed commit
        type: boolean
        default: false
      stabilization_seconds:
        description: Seconds to wait for late queue entries
        type: string
        default: ''
      dry_run:
        description: Analyze without creating a release or tag
        type: boolean
        default: false
      direct_impact:
        description: Optional override for an ambiguous batch of direct commits
        type: choice
        options: [auto, major, minor, patch, none]
        default: auto

concurrency:
  group: vortex-intelligent-release
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    uses: axiumhq/.github/.github/workflows/intelligent-release.yml@main
    with:
      stabilization_seconds: ${{ inputs.stabilization_seconds }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      direct_impact: ${{ inputs.direct_impact || 'auto' }}
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
