name: Intelligent release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Reanalyze an already processed commit
        type: boolean
        default: false
      stabilization_seconds:
        description: Seconds to wait for late queue entries
        type: string
        default: '900'
      dry_run:
        description: Analyze without creating a release or tag
        type: boolean
        default: false

concurrency:
  group: vortex-intelligent-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    uses: axiumhq/.github/.github/workflows/intelligent-release.yml@main
    with:
      stabilization_seconds: ${{ inputs.stabilization_seconds || '900' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
